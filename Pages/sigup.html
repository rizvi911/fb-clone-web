<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Style Sheets/signup.css">
    <title>Facebook - Create Account</title>

</head>

<body>

  <div class="page">

    <div class="signup-container">

      <!-- Back Arrow -->
      <div class="back">‹</div>

      <!-- Meta -->
      <div class="meta-logo">
        <span class="meta-symbol">∞</span>
        <span class="meta-text">Meta</span>
      </div>

      <!-- Heading -->
      <h1>Get started on Facebook with a Meta account</h1>

      <p class="description">
        A Meta Account lets you access multiple Meta technologies, such as
        Facebook, easily and securely.
      </p>

      <!-- Name -->
      <label>Name</label>

      <div class="name-fields">
        <input type="text" placeholder="First name">
        <input type="text" placeholder="Surname">
      </div>

      <!-- Date of Birth -->
      <div class="dob-section">

        <label class="dob-label">
          Date of birth
          <span class="question">?</span>
        </label>

        <div class="dob-fields">

          <select>
            <option selected disabled>Day</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
            <option>26</option>
            <option>27</option>
            <option>28</option>
            <option>29</option>
            <option>30</option>
            <option>31</option>
          </select>

          <select>
            <option selected disabled>Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
          </select>

          <select>
            <option selected disabled>Year</option>
            <option>2026</option>
            <option>2025</option>
            <option>2024</option>
            <option>2023</option>
            <option>2022</option>
            <option>2021</option>
            <option>2020</option>
            <option>2019</option>
            <option>2018</option>
            <option>2017</option>
            <option>2016</option>
            <option>2015</option>
            <option>2014</option>
            <option>2013</option>
            <option>2012</option>
            <option>2011</option>
            <option>2010</option>
            <option>2009</option>
            <option>2008</option>
            <option>2007</option>
            <option>2006</option>
            <option>2005</option>
            <option>2004</option>
            <option>2003</option>
            <option>2002</option>
            <option>2001</option>
            <option>2000</option>
          </select>

        </div>
      </div>

      <!-- Gender -->
      <div class="gender-section">

        <label class="gender-label">
          Gender
          <span class="question">?</span>
        </label>

        <select class="gender-select">
          <option selected disabled>Select your gender</option>
          <option>Female</option>
          <option>Male</option>
          <option>Custom</option>
        </select>

      </div>

      <!-- Contact -->
      <div class="contact-section">

        <label>Mobile number or email address</label>

        <input
          class="contact-input error"
          type="text"
          placeholder="Mobile number or email address"
        >

        <p class="help-text">
          You may receive notifications from us.
          <a href="#">Learn why we ask for your contact information</a>
        </p>

      </div>

      <!-- Password -->
      <div class="password-section">

        <label>Password</label>

        <input
          type="password"
          placeholder="Password"
        >

      </div>

      <!-- Sign Up -->
      <button class="signup-btn">
        <a href="./dashboard.html" style="text-decoration: none; color: white ; font-size: 20px;">Sign Up</a>
      </button>

    </div>

  </div>

</body>
</html>
