<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Style Sheets/login.css">
  <title>Login Demo</title>
</head>

<body>

  <div class="container">

    <!-- LEFT -->
    <section class="left">
      <div class="left-content">

        <div class="logo">f</div>

        <h1 class="headline">
          Explore<br>
          the<br>
          things<br>
          <span>you love.</span>
        </h1>

        <div class="cards">
          <div class="card card1"></div>
          <div class="card card2"></div>
          <div class="card card3"></div>
          <div class="circle"></div>
        </div>

      </div>
    </section>

    <!-- RIGHT -->
    <section class="right">
      <div class="login-box">

        <h2>Log In Facebook</h2>

        <form onsubmit="Login(event)">
          <input class="input" type="text" placeholder="Email address or mobile number" autocomplete="off">

          <input class="input" type="password" placeholder="Password" autocomplete="off">

          <button class="login-btn" type="submit">
            <a href="./dashboard.html" style="text-decoration: none; color: white ; font-size: 20px; width: 100%;">Log in</a>
          </button>
        </form>

        <a href="#" class="forgot" onclick="event.preventDefault()">
          Forgotten password?
        </a>

        <button class="create-btn">
          <a href="./sigup.html">Create new account</a>
        </button>
      </div>
    </section>
  </div>
</body>

</html>
